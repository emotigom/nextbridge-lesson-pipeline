name: Pipeline QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pipeline-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  approval-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pipeline

      - name: Unit tests
        working-directory: pipeline
        run: python3 -m unittest discover -s tests -v

      - name: Validate synthetic pipeline state
        working-directory: pipeline
        run: |
          python3 tools/pipelinectl.py validate --state fixtures/pipeline/pass/state.json
          python3 tools/pipelinectl.py check --state fixtures/pipeline/pass/state.json --to ALL_CONTENT_APPROVED

      - name: Validate migrated feed-why state and WIP
        working-directory: pipeline
        run: |
          python3 tools/pipelinectl.py validate --state courses/feed-why/state.json
          python3 tools/pipelinectl.py status --state courses/feed-why/state.json
          python3 tools/pipelinectl.py check --state courses/feed-why/state.json --to PRACTICE_TOOL_BUILD_ALLOWED
          python3 tools/pipelinectl.py wip-check --root courses

      - name: Resolve pinned Factory SHA from feed-why
        id: factory
        working-directory: pipeline
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          s=json.load(open('courses/feed-why/state.json',encoding='utf-8'))
          assert s['factory']['repository']=='emotigom/nextbridge-lesson-factory'
          print('sha='+s['factory']['commitSha'])
          PY

      - name: Checkout exact trusted Factory commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emotigom/nextbridge-lesson-factory
          ref: ${{ steps.factory.outputs.sha }}
          path: factory

      - name: Verify ChatGPT handoff to public-safe lineage
        working-directory: pipeline
        run: |
          mkdir -p out
          python3 tools/handoff_lineage.py \
            --handoff ../factory/fixtures/handoff/chatgpt-pass/handoff.json \
            --factory-root ../factory \
            --factory-commit '${{ steps.factory.outputs.sha }}' \
            --captured-at synthetic-ci \
            --out out/handoff-lineage.json
          python3 - <<'PY'
          import json
          r=json.load(open('out/handoff-lineage.json',encoding='utf-8'))
          assert r['designState']=='ALL_CONTENT_APPROVED'
          assert r['approvedSessions']==[1]
          text=open('out/handoff-lineage.json',encoding='utf-8').read()
          assert 'studentText' not in text and 'teacherScript' not in text
          PY

      - name: Smoke one-command new lesson workspace
        working-directory: pipeline
        run: |
          rm -rf /tmp/nextbridge-new-lesson-smoke
          python3 tools/new_lesson.py \
            --course-id smoke-course \
            --title 'Smoke lesson' \
            --sessions 3 \
            --workspace /tmp/nextbridge-new-lesson-smoke \
            --factory-commit '${{ steps.factory.outputs.sha }}'
          python3 tools/pipelinectl.py validate --state /tmp/nextbridge-new-lesson-smoke/pipeline-state.draft.json
          python3 tools/pipelinectl.py status --state /tmp/nextbridge-new-lesson-smoke/pipeline-state.draft.json | tee /tmp/new-lesson-status.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/new-lesson-status.json',encoding='utf-8'))
          assert r['milestone']=='CLEAN_INTAKE'
          PY

      - name: Smoke handoff to Pipeline draft sync
        working-directory: pipeline
        run: |
          rm -rf /tmp/nextbridge-handoff-sync
          python3 tools/handoff_sync.py \
            --handoff ../factory/fixtures/handoff/chatgpt-pass/handoff.json \
            --factory-root ../factory \
            --factory-commit '${{ steps.factory.outputs.sha }}' \
            --captured-at synthetic-ci \
            --out-dir /tmp/nextbridge-handoff-sync
          python3 tools/pipelinectl.py validate --state /tmp/nextbridge-handoff-sync/courses/synthetic-course/state.json
          python3 tools/pipelinectl.py status --state /tmp/nextbridge-handoff-sync/courses/synthetic-course/state.json | tee /tmp/handoff-sync-status.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/handoff-sync-status.json',encoding='utf-8'))
          assert r['milestone']=='ALL_CONTENT_APPROVED'
          s=json.load(open('/tmp/nextbridge-handoff-sync/courses/synthetic-course/state.json',encoding='utf-8'))
          assert s['factory']['verificationMode']=='HANDOFF_LINEAGE'
          assert s['approvals']['pptxBuild']['status']=='PENDING'
          assert s['approvals']['practiceToolBuild']['status']=='PENDING'
          text=open('/tmp/nextbridge-handoff-sync/handoffs/synthetic-course.json',encoding='utf-8').read()
          assert 'studentText' not in text and 'teacherScript' not in text
          PY

      - name: Verify synthetic public bundle at pinned SHA
        working-directory: pipeline
        run: python3 tools/pipelinectl.py factory-check --state fixtures/pipeline/pass/state.json --factory-root ../factory

      - name: Verify feed-why private proof and candidate hashes
        working-directory: pipeline
        run: python3 tools/pipelinectl.py factory-check --state courses/feed-why/state.json --factory-root ../factory
